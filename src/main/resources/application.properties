spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.expiration=43600000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.root=INFO
logging.level.com.se_frms=DEBUG
logging.file.name=logs/frms.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

sms.msg24x7.send-url=https://control.msg24x7.com/api/v2/SendSMS
sms.msg24x7.sender-id=SCEDGE
sms.msg24x7.template-id=1707166453043969528
sms.msg24x7.principle-entity-id=1701166436728776010
sms.msg24x7.login-otp-message=Dear partner, your login otp is {otp} Don't share with anyone Regards Secureedge Fintech Pvt Ltd
sms.otp.return-in-response=false
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://frms-uat.secureedge.in/create-new-password}
app.admin.security-alert-email=${ADMIN_SECURITY_ALERT_EMAIL:}
